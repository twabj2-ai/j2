<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갑부복권 이체 안내</title>
  <style>
    body { text-align: center; font-family: 'Pretendard', sans-serif; padding: 50px 20px; }
    .copy-btn { 
      background-color: #ffd700; color: #000; font-size: 18px; font-weight: bold;
      padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; width: 100%; max-width: 300px;
    }
  </style>
</head>
<body>
  <h2>갑부복권<br>이체 전용 계좌</h2>
  <p>아래 버튼을 눌러 계좌를 복사하신 후,<br>사용하시는 뱅킹 앱을 열어주세요.</p>
  
  <button class="copy-btn" onclick="copyAccount()">계좌번호 복사하기</button>

  <script>
    function copyAccount() {
      // 여기에 실제 사장님의 은행명과 계좌번호를 띄어쓰기 포함해 입력하세요 (예: 농협 123-4567-8901)
      const account = "농협 123-4567-8901"; 
      
      navigator.clipboard.writeText(account).then(() => {
        alert("갑부복권 이체 전용계좌가 복사 되었습니다");
      }).catch(err => {
        alert("복사에 실패했습니다. 다시 시도해주세요.");
      });
    }
  </script>
</body>
</html>
